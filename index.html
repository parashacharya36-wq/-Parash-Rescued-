<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parash Rescue</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }
    header {
      background: #d71920;
      color: white;
      padding: 25px 10px;
    }
    .flag { font-size: 35px; }
    h1 { margin: 8px 0; }
    .sos {
      margin: 30px auto;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #d71920;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 5px 20px #999;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }
    button {
      padding: 20px 10px;
      border: none;
      border-radius: 15px;
      background: white;
      font-size: 17px;
      box-shadow: 0 3px 10px #ccc;
    }
    .contacts {
      margin: 10px 20px 30px;
      padding: 20px;
      background: white;
      border-radius: 15px;
    }
    footer {
      padding: 20px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <div class="flag">🇳🇵</div>
  <h1>PARASH RESCUE</h1>
  <p>Emergency Rescue App</p>
</header>

<div class="sos" onclick="alert('🚨 Emergency SOS Activated!')">
  SOS
</div>

<div class="buttons">
  <button onclick="alert('🚑 Ambulance requested')">🚑<br>AMBULANCE</button>
  <button onclick="alert('👮 Police assistance')">👮<br>POLICE</button>
  <button onclick="alert('🚒 Fire & Rescue')">🚒<br>FIRE & RESCUE</button>
  <button onclick="alert('📍 Location service')">📍<br>MY LOCATION</button>
</div>

<div class="contacts">
  <h2>👥 Emergency Contacts</h2>
  <p>Emergency help at your fingertips.</p>
</div>

<footer>
  Created by Parash Sharma 🇳🇵
</footer>

</body>
</html>
